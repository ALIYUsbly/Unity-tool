[project]
name = "Unity"
version = "0.1.0"
description = "Phone service GUI (PySide6) wrapping the command-line tools in vendor/"
requires-python = ">=3.10"
# The app itself only needs Qt. Everything else below belongs to the tools.
dependencies = [
    "pyside6>=6.11.2",
]

[dependency-groups]
# Python packages imported by the vendored tools (vendor/mtkclient, vendor/edl,
# vendor/spdclient). Check each tool's requirements.txt and trim what you do not
# use. customtkinter is NOT used by Unity itself (left over from the Tk version):
# run `grep -ri customtkinter vendor/` and drop it if nothing there needs it.
tools = [
    "capstone>=5.0.9",
    "colorama>=0.4.6",
    "customtkinter>=6.0.0",
    "docopt>=0.6.2",
    "exscript>=2.6.32",
    "fusepy>=3.0.1",
    "keystone-engine>=0.9.2",
    "lxml>=4.6.1",
    "miasst>=1.4.4",
    "passlib>=1.7.4",
    "pycryptodome>=3.24.0",
    "pycryptodomex>=3.24.0",
    "pyserial>=3.4",
    "pyudev>=0.24.5",
    "pyusb>=1.1.0",
    "qrcode>=8.2",
    "requests>=2.34.2",
    "unicorn>=2.1.4",
]
dev = [
    "flake8>=7.4.1",
]

[tool.uv]
# plain `uv sync` keeps installing everything, as before
default-groups = ["tools", "dev"]
